<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233150d4'/%3E%3Cpath d='M9 22V10h3v5l5-5h4l-6 6 6 6h-4l-5-5v5z' fill='%23fff'/%3E%3C/svg%3E">
  {% feed_meta %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <a class="skip" href="#main">Skip to content</a>
  {% unless page.body_class == 'home' %}
  <header class="site-bar">
    <a class="site-bar__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  {% endunless %}
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-foot">
    <p>Written by Kris. Code on <a href="https://github.com/{{ site.github }}">GitHub</a>. <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>.</p>
  </footer>
  {% if page.charts %}<script src="{{ '/assets/js/charts.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
