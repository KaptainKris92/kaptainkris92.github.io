title: Kris’ Kreations
description: Notes from my side projects, from soldering a puff counter to running an AI video channel on GitHub Actions.
author: Kris
url: https://kaptainkris92.github.io
github: KaptainKris92

# Posts live at /blog/<slug>/. /vape-logger/ is taken by the Vaper Taper app's own Pages site.
# Set for posts only: a site-wide permalink ending in "/" also turns pages like
# privacy.html into /privacy/, which broke the URL registered with Google and Meta.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3

plugins:
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
